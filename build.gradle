plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Jackson
	include modImplementation ('com.fasterxml.jackson.core:jackson-core:2.19.1')
	include modImplementation ('com.fasterxml.jackson.core:jackson-databind:2.19.1')
	include modImplementation ('com.fasterxml.jackson.core:jackson-annotations:2.19.1')
    // Cloth
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // ModMenu
    modCompileOnly modRuntimeOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
	
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:17.0.807"
	modCompileOnly "dev.emi:emi-fabric:1.1.13+1.21.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version, "cloth_config_version": project.cloth_config_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

publishing {
	configureRepository(repositories)

	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}

def configureRepository(RepositoryHandler repositories) {
	def user = project.findProperty('repository_username') ?: System.getenv('repository_username')
	def pw = project.findProperty('repository_password') ?: System.getenv('repository_password')

	if (user != null && pw != null) {
		repositories.maven {
			name = 'Skullian'
			url = 'https://repo.skullian.com/releases/'
			credentials {
				username = user
				password = pw
			}
		}
		return
	}

	println 'Using repository without credentials.'
	repositories.maven {
		name = 'Skullian'
		url = 'https://repo.skullian.com/releases/'
	}
}